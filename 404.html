<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Knowledge Base by nic</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/knowledge-base/assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Display:wght@500;700&family=Google+Sans:wght@400;500&family=Roboto+Mono:wght@400&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --md-primary: #0b57d0;
    --md-on-primary: #ffffff;
    --md-primary-container: #d3e3fd;
    --md-on-primary-container: #001b3f;
    --md-surface: #fdfcff;
    --md-surface-1: #f3f3f8;
    --md-on-surface: #1a1c1e;
    --md-on-surface-var: #44474e;
    --md-outline-var: #c4c6d0;
    --g-blue: #4285f4;
    --g-red: #ea4335;
    --g-yellow: #fbbc04;
    --g-green: #34a853;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Google Sans', 'Roboto', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: var(--md-surface);
    color: var(--md-on-surface);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .wrap {
    text-align: center;
    max-width: 560px;
  }
  .code {
    font-family: 'Google Sans Display', 'Google Sans', sans-serif;
    font-size: clamp(96px, 18vw, 168px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
    background: linear-gradient(90deg, var(--g-blue) 0%, var(--g-red) 50%, var(--g-yellow) 75%, var(--g-green) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Google Sans Display', 'Google Sans', sans-serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.012em;
    margin-bottom: 16px;
  }
  p {
    font-size: 15px;
    color: var(--md-on-surface-var);
    margin-bottom: 32px;
    line-height: 1.55;
  }
  .actions {
    display: inline-flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 999px;
    font-family: 'Google Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: box-shadow 0.2s, transform 0.15s;
  }
  .btn-primary {
    background: var(--md-primary);
    color: var(--md-on-primary);
  }
  .btn-primary:hover {
    box-shadow: 0 2px 6px rgba(11, 87, 208, 0.3);
    transform: translateY(-1px);
  }
  .btn-tonal {
    background: var(--md-primary-container);
    color: var(--md-on-primary-container);
  }
  .btn-tonal:hover {
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }
  .meta {
    margin-top: 48px;
    font-family: 'Roboto Mono', monospace;
    font-size: 12px;
    color: var(--md-on-surface-var);
    letter-spacing: 0.03em;
  }
  .meta code {
    background: var(--md-surface-1);
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--md-outline-var);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>这条路径暂时找不到</h1>
    <p>页面可能改名、移动或还没上线。<br>从首页可以找到所有现有内容入口。</p>
    <div class="actions">
      <a class="btn btn-primary" href="/knowledge-base/">回到首页</a>
      <a class="btn btn-tonal" href="https://github.com/nic-wang/knowledge-base/issues">报告失效链接</a>
    </div>
    <div class="meta">
      <code id="path">--</code>
    </div>
  </div>
<script>
  document.getElementById('path').textContent = location.pathname + location.search;
</script>
</body>
</html>
